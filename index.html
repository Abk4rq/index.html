    <style>
        * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border-color 0.3s; }
        
        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }

        body.dark { 
            background: #030712;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #a855f7, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: moveStars 60s linear infinite;
            color: #f8fafc;
        }
        body.dark .container { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        body.dark .search-input, body.dark input[type="text"], body.dark input[type="file"], body.dark select, body.dark textarea { background: rgba(30, 41, 59, 0.6); color: #fff; border-color: rgba(255, 255, 255, 0.12); }

<script>
    let isAdmin = false;
    let allItems = [];
    let currentCategory = 'All';
    let secretClicks = 0;

    function secretAdminLogin() {
        secretClicks++;
        if (secretClicks >= 3) {
            secretClicks = 0;
            loginAdmin();
        }
        setTimeout(() => { secretClicks = 0; }, 1500);
    }

    async function fetchWeather() {
        try {
            let res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=30.5081&current_weather=true');
            let data = await res.json();
            let temp = data.current_weather.temperature;
            document.getElementById('weatherText').innerText = `${temp}°C | Signal 🟢`;
        } catch (e) {
            document.getElementById('weatherText').innerText = `Stable Signal 🟢`;
        }
    }
    fetchWeather();

    function toggleTheme() {
        const body = document.body;
        if (body.classList.contains('dark')) {
            body.classList.replace('dark', 'light');
        } else {
            body.classList.replace('light', 'dark');
        }
    }

    function updateClock() {
        const now = new Date();
        const optionsDate = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
        const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        let dateStr = now.toLocaleDateString('en-US', optionsDate);
        const timeStr = now.toLocaleTimeString('en-US', optionsTime);
        document.getElementById('liveClock').innerText = `${dateStr} | ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loginAdmin() {
        if (!isAdmin) {
            let password = prompt("Enter Admin Password:");
            if (password && password.trim() === "1234") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                renderGallery(allItems);
                alert("Welcome Abdullah, Admin panel activated.");
            } else {
                alert("Incorrect Password!");
            }
        }
    }

    const firebaseConfig = {
        apiKey: "AIzaSyBLpPGMsn3CS7001EaPrgifTveSwIxw8GE",
        authDomain: "tvservice-d3b56.firebaseapp.com",
        projectId: "tvservice-d3b56",
        storageBucket: "tvservice-d3b56.appspot.com",
        messagingSenderId: "155014444459",
        appId: "1:155014444459:web:2ab8793055fba5a7c90eee"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function saveData() {
        const roomInput = document.getElementById('roomInput');
        const categoryInput = document.getElementById('categoryInput');
        const statusInput = document.getElementById('statusInput');
        const fileInput = document.getElementById('imgInput');
        const descInput = document.getElementById('descInput');
        
        if (!fileInput.files[0]) {
            alert("Please select an image first!");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        alert("Compressing and publishing image instantly...");

        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 900;
                const MAX_HEIGHT = 900;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
                const date = new Date().toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                db.collection("tvgallery").add({
                    room: roomInput.value.trim() || "General",
                    category: categoryInput.value,
                    status: statusInput.value,
                    likes: 0,
                    img: compressedDataUrl,
                    desc: descInput.value || "",
                    date: date,
                    timestamp: Date.now()
                })
                .then(() => {
                    roomInput.value = '';
                    fileInput.value = '';
                    descInput.value = '';
                    alert("Image published permanently and saved successfully!");
                })
                .catch(error => {
                    alert("Error publishing: " + error.message);
                });
            };
        };
        reader.readAsDataURL(file);
    }

    function loadGallery() {
        db.collection("tvgallery").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            allItems = [];
            snapshot.forEach(doc => {
                allItems.push({ id: doc.id, ...doc.data() });
            });
            document.getElementById('statsCounter').innerText = `📊 Total Works Published: ${allItems.length}`;
            filterGallery();
        });
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterGallery();
    }

    function renderGallery(items) {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        if (items.length === 0) {
            gallery.innerHTML = '<p style="text-align:center; color:#64748b; padding: 20px;">No works found.</p>';
            return;
        }

        items.forEach(item => {
            let isCompleted = item.status === 'Completed';
            let statusClass = isCompleted ? 'status-completed' : 'status-progress';
            let statusText = isCompleted ? '✅ Completed' : '❌ Pending';
            let currentLikes = item.likes || 0;

            let adminControls = isAdmin ? `
                <div class="admin-controls">
                    <button class="edit-btn" onclick="editItem('${item.id}', '${encodeURIComponent(item.room || '')}', '${encodeURIComponent(item.desc || '')}', '${item.status || 'Completed'}')">Edit</button>
                    <button class="del-btn" onclick="deleteItem('${item.id}')">Delete</button>
                </div>
            ` : '';

            gallery.innerHTML += `
                <div class="image-card">
                    <div class="card-header-info">
                        <div class="room-badge">🏠 Room: ${item.room || 'General'}</div>
                        <div class="status-badge ${statusClass}">${statusText}</div>
                    </div>
                    <img src="${item.img}" alt="TV Service Image">
                    <p>${item.desc}</p>
                    <span class="date-tag">${item.date || ''}</span>
                    <div class="card-actions">
                        <button class="share-btn" onclick="shareCard('${item.room || 'General'}', '${encodeURIComponent(item.desc || '')}')">📤 Share</button>
                        <button class="like-btn" onclick="likeItem('${item.id}', ${currentLikes})">❤️ ${currentLikes}</button>
                    </div>
                    ${adminControls}
                </div>
            `;
        });
    }

    function likeItem(docId, currentLikes) {
        db.collection("tvgallery").doc(docId).update({
            likes: currentLikes + 1
        }).catch(error => {
            alert("Error: " + error.message);
        });
    }

    function filterGallery() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = allItems.filter(item => {
            const matchesCategory = (currentCategory === 'All' || item.category === currentCategory);
            const matchesSearch = (item.room || "").toLowerCase().includes(query) || (item.desc || "").toLowerCase().includes(query);
            return matchesCategory && matchesSearch;
        });
        renderGallery(filtered);
    }

    function shareCard(room, desc) {
        let text = `TV Service Work - Room: ${room}\nDetails: ${decodeURIComponent(desc)}`;
        if (navigator.share) {
            navigator.share({ title: 'TV Service', text: text }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            alert("Details copied to clipboard!");
        }
    }

    function editItem(docId, currentRoom, currentDesc, currentStatus) {
        let decRoom = decodeURIComponent(currentRoom);
        let decDesc = decodeURIComponent(currentDesc);
        
        let newRoom = prompt("Edit Room Number:", decRoom);
        if (newRoom !== null) {
            let newDesc = prompt("Edit Description:", decDesc);
            if (newDesc !== null) {
                let newStatus = prompt("Edit Status (Completed / Pending):", currentStatus);
                db.collection("tvgallery").doc(docId).update({
                    room: newRoom.trim(),
                    desc: newDesc,
                    status: newStatus ? newStatus.trim() : currentStatus
                }).then(() => {
                    alert("Updated successfully!");
                }).catch(error => {
                    alert("Error updating: " + error.message);
                });
            }
        }
    }

    function deleteItem(docId) {
        if (confirm("Are you sure you want to delete this image?")) {
            db.collection("tvgallery").doc(docId).delete();
        }
    }

    loadGallery();
</script>

</body>
</html>
