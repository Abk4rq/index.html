<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV SERVICE - Official Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #090d16; color: #fff; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 650px; margin: 0 auto; background: rgba(255, 255, 255, 0.03); padding: 30px; border-radius: 24px; border: 1px solid #333; }
        .header { text-align: center; cursor: pointer; border-bottom: 1px solid #333; padding-bottom: 20px; }
        h1 { background: linear-gradient(45deg, #00c6ff, #9b51e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #1a1f2e; border: 1px solid #444; color: white; border-radius: 8px; }
        .add-btn { width: 100%; padding: 12px; background: #10b981; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .image-card { background: #1a1f2e; padding: 15px; margin-top: 20px; border-radius: 15px; }
        img { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header" ondblclick="document.getElementById('adminPanel').style.display='block'">
        <h1>TV SERVICE</h1>
        <p>معرض الصور الرسمي</p>
    </div>

    <div id="adminPanel" style="display:none;">
        <input type="file" id="imgInput" accept="image/*">
        <textarea id="descInput" placeholder="وصف الصورة..."></textarea>
        <button class="add-btn" onclick="saveData()">نشر الصورة للجميع</button>
    </div>

    <div id="gallery"></div>
</div>

<script>
    // معلومات مشروعك التي نسختها
    const firebaseConfig = {
        apiKey: "AIzaSyBLpPGMsn3CS7001EaPrgifTveSwIxw8GE",
        authDomain: "tvservice-d3b56.firebaseapp.com",
        projectId: "tvservice-d3b56",
        storageBucket: "tvservice-d3b56.appspot.com",
        messagingSenderId: "155014444459",
        appId: "1:155014444459:web:2ab8793055fba5a7c90eee"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function saveData() {
        const file = document.getElementById('imgInput').files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            db.collection("tvgallery").add({
                img: e.target.result,
                desc: document.getElementById('descInput').value,
                date: new Date().toLocaleDateString()
            }).then(() => {
                alert("تم النشر بنجاح!");
                location.reload();
            });
        };
        reader.readAsDataURL(file);
    }

    // عرض الصور
    db.collection("tvgallery").onSnapshot(snapshot => {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        snapshot.forEach(doc => {
            const data = doc.data();
            gallery.innerHTML += `
                <div class="image-card">
                    <img src="${data.img}">
                    <p>${data.desc}</p>
                </div>
            `;
        });
    });
</script>

</body>
</html>
