<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV SERVICE - Official Elite Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #030712;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            margin: 0; padding: 20px; direction: ltr; color: #f8fafc;
            user-select: none; -webkit-user-select: none;
        }

        .container { 
            max-width: 680px; margin: 0 auto; 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 35px; border-radius: 28px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(14, 165, 233, 0.05); 
        }
        
        .live-clock {
            text-align: center; font-family: 'Courier New', Courier, monospace;
            font-size: 13px; font-weight: bold;
            background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px; letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-logo { 
            text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            padding-bottom: 25px; margin-bottom: 25px; cursor: pointer;
            transition: 0.3s;
        }
        .header-logo:hover { transform: scale(1.01); }
        .header-logo h1 { 
            font-size: 44px; font-weight: 900; margin: 0; 
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #b19fff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 3px; text-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
        }
        .header-logo p { 
            margin: 8px 0 0 0; color: #94a3b8; font-size: 13px; font-weight: 700; 
            letter-spacing: 2px; text-transform: uppercase;
        }

        /* قسم التواصل في الأعلى */
        .contact-box {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; padding: 20px;
            margin-bottom: 25px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .contact-box h3 { font-size: 16px; color: #38bdf8; margin: 0 0 15px 0; font-weight: 700; }
        .contact-buttons { display: flex; gap: 12px; justify-content: center; }
        .contact-btn {
            flex: 1; padding: 12px 18px; border-radius: 14px;
            font-weight: bold; font-size: 14px; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s;
        }
        .whatsapp-btn {
            background: rgba(16, 185, 129, 0.15); color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }
        .whatsapp-btn:hover { background: #10b981; color: white; transform: translateY(-2px); }
        .call-btn {
            background: rgba(56, 189, 248, 0.15); color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.35);
        }
        .call-btn:hover { background: #0ea5e9; color: white; transform: translateY(-2px); }

        .search-box { margin-bottom: 25px; }
        .search-input {
            width: 100%; padding: 14px 18px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px; color: #fff; font-family: 'Poppins', sans-serif; font-size: 15px;
            outline: none; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .search-input:focus { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        .search-input::placeholder { color: #94a3b8; }

        #adminPanel { 
            display: none; background: rgba(30, 41, 59, 0.9); 
            padding: 25px; border-radius: 20px; margin-bottom: 30px; 
            border: 1px solid rgba(56, 189, 248, 0.4); 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 10px 25px rgba(0,0,0,0.4);
        }
        
        .form-title { color: #38bdf8; font-weight: bold; margin-top: 0; margin-bottom: 15px; font-size: 17px; }
        
        input[type="text"], input[type="file"], textarea { 
            width: 100%; padding: 14px; margin-bottom: 15px; 
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12); 
            border-radius: 14px; color: #fff; font-family: 'Poppins', sans-serif; font-size: 14px;
            outline: none; transition: 0.3s;
        }
        input[type="text"]:focus, input[type="file"]:focus, textarea:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        textarea { resize: vertical; height: 90px; }
        textarea::placeholder, input[type="text"]::placeholder { color: #64748b; }
        
        .add-btn { 
            width: 100%; padding: 14px; 
            background: linear-gradient(135deg, #10b981, #059669); 
            color: white; border: none; border-radius: 14px; 
            font-weight: bold; font-size: 16px; cursor: pointer; 
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
            transition: 0.3s; 
        }
        .add-btn:hover { opacity: 0.95; transform: translateY(-2px); }

        .image-card { 
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 20px; margin-top: 25px; 
            border-radius: 22px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
        }
        
        .room-badge {
            display: inline-block;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white; padding: 6px 14px; border-radius: 10px;
            font-weight: 700; font-size: 14px; margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            letter-spacing: 1px;
        }

        .image-card img { 
            width: 100%; max-height: 450px; object-fit: contain; 
            border-radius: 16px; display: block; margin-bottom: 15px; 
            background: #020617; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .image-card p { 
            font-size: 16px; color: #f1f5f9; margin: 12px 0; 
            line-height: 1.7; font-weight: 600; word-break: break-word;
        }
        .date-tag { 
            font-size: 12px; color: #94a3b8; display: block; margin-bottom: 15px; 
            font-family: 'Courier New', Courier, monospace;
        }
        
        .admin-controls { display: flex; gap: 10px; margin-top: 15px; }
        .admin-controls button { 
            flex: 1; padding: 12px; border: none; border-radius: 12px; 
            font-weight: bold; font-family: 'Poppins', sans-serif; cursor: pointer; 
            transition: 0.3s; 
        }
        .edit-btn { background: rgba(217, 119, 6, 0.2); color: #fbbf24; border: 1px solid rgba(217, 119, 6, 0.4); }
        .edit-btn:hover { background: #d97706; color: white; }
        .del-btn { background: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid rgba(220, 38, 38, 0.4); }
        .del-btn:hover { background: #dc2626; color: white; }

        .footer { 
            text-align: center; margin-top: 30px; padding-top: 20px; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .footer-text { color: #64748b; font-size: 11px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .creation-date { color: #94a3b8; font-size: 12px; margin-bottom: 12px; font-family: 'Courier New', Courier, monospace; }
        .dev-name {
            font-size: 20px; font-weight: 900;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px; display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="live-clock" id="liveClock">Loading...</div>

    <div class="header-logo" ondblclick="loginAdmin()" title="Developer Area">
        <h1>TV SERVICE</h1>
        <p>OFFICIAL MEDIA GALLERY</p>
    </div>

    <!-- قسم التواصل في الأعلى (أزرار متجاورة يمين ويسار) -->
    <div class="contact-box">
        <h3>Contact & Maintenance Services</h3>
        <div class="contact-buttons">
            <a href="https://wa.me/9647818025533" target="_blank" class="contact-btn whatsapp-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448c-.352-.19-.71-.383-1.077-.577l-5.318 1.391zm22.585-20.354c-2.422-2.423-5.642-3.757-9.066-3.758-7.054 0-12.793 5.739-12.795 12.796-.001 2.253.589 4.453 1.708 6.388l-1.808 6.602 6.772-1.776c1.854 1.011 3.968 1.545 6.126 1.546 7.054 0 12.793-5.739 12.795-12.796.002-3.424-1.332-6.645-3.754-9.068zm-9.066 19.349c-1.815 0-3.593-.488-5.145-1.411l-.369-.221-3.83 1.004 1.023-3.733-.24-.381c-1.013-1.611-1.548-3.488-1.547-5.405.002-5.626 4.581-10.205 10.209-10.205 2.727.001 5.288 1.063 7.218 2.993 1.93 1.93 2.991 4.492 2.99 7.219-.002 5.626-4.582 10.205-10.209 10.205zm5.597-7.593c-.305-.153-1.805-.891-2.085-.994-.28-.103-.483-.153-.686.153-.203.305-.788.994-.966 1.198-.178.204-.356.229-.661.076-.305-.153-1.285-.473-2.449-1.512-.905-.806-1.517-1.802-1.696-2.107-.178-.305-.019-.47.133-.623.137-.137.305-.356.458-.534.153-.178.203-.305.305-.51.102-.204.051-.382-.025-.534-.076-.153-.686-1.652-.94-2.261-.248-.598-.501-.517-.686-.527l-.585-.01c-.203 0-.533.076-.813.382-.28.305-1.068 1.044-1.068 2.547 0 1.503 1.095 2.952 1.248 3.156.153.203 2.155 3.291 5.226 4.613.73.315 1.299.503 1.742.645.733.234 1.4.201 1.928.122.591-.088 1.805-.738 2.061-1.451.255-.713.255-1.323.179-1.451-.076-.128-.28-.204-.585-.357z"/></svg>
                WhatsApp
            </a>
            <a href="tel:+9647818025533" class="contact-btn call-btn">
                📞 Call Now
            </a>
        </div>
    </div>

    <!-- خانة البحث الذكي -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search by Room Number (e.g. 101)..." oninput="filterGallery()">
    </div>

    <div id="adminPanel">
        <p class="form-title">⚙️ Admin Control Panel</p>
        <input type="text" id="roomInput" placeholder="Enter Room Number (e.g. Room 12)">
        <input type="file" id="imgInput" accept="image/*">
        <textarea id="descInput" placeholder="Enter image description or service details..."></textarea>
        <button class="add-btn" onclick="saveData()">Publish Image Instantly 🚀</button>
    </div>

    <div id="gallery"></div>

    <div class="footer">
        <div class="footer-text">Designed & Developed by</div>
        <div class="dev-name">Abdullah Ahmed TV SERVICE</div>
        <div class="creation-date" style="margin-top: 10px;">Website Created: 2026</div>
    </div>
</div>

<script>
    let isAdmin = false;
    let allItems = [];

    function updateClock() {
        const now = new Date();
        const optionsDate = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
        const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        let dateStr = now.toLocaleDateString('en-US', optionsDate);
        const timeStr = now.toLocaleTimeString('en-US', optionsTime);
        document.getElementById('liveClock').innerText = `${dateStr} | ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loginAdmin() {
        if (!isAdmin) {
            let password = prompt("Enter Admin Password:");
            if (password && password.trim() === "1234") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                renderGallery(allItems);
                alert("Welcome Abdullah, Admin panel activated.");
            } else {
                alert("Incorrect Password!");
            }
        }
    }

    const firebaseConfig = {
        apiKey: "AIzaSyBLpPGMsn3CS7001EaPrgifTveSwIxw8GE",
        authDomain: "tvservice-d3b56.firebaseapp.com",
        projectId: "tvservice-d3b56",
        storageBucket: "tvservice-d3b56.appspot.com",
        messagingSenderId: "155014444459",
        appId: "1:155014444459:web:2ab8793055fba5a7c90eee"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function saveData() {
        const roomInput = document.getElementById('roomInput');
        const fileInput = document.getElementById('imgInput');
        const descInput = document.getElementById('descInput');
        
        if (!fileInput.files[0]) {
            alert("Please select an image first!");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        alert("Compressing and publishing image instantly...");

        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 900;
                const MAX_HEIGHT = 900;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
                const date = new Date().toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                db.collection("tvgallery").add({
                    room: roomInput.value.trim() || "General",
                    img: compressedDataUrl,
                    desc: descInput.value || "",
                    date: date,
                    timestamp: Date.now()
                })
                .then(() => {
                    roomInput.value = '';
                    fileInput.value = '';
                    descInput.value = '';
                    alert("Image published permanently and saved successfully!");
                })
                .catch(error => {
                    alert("Error publishing: " + error.message);
                });
            };
        };
        reader.readAsDataURL(file);
    }

    function loadGallery() {
        db.collection("tvgallery").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            allItems = [];
            snapshot.forEach(doc => {
                allItems.push({ id: doc.id, ...doc.data() });
            });
            renderGallery(allItems);
        });
    }

    function renderGallery(items) {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        if (items.length === 0) {
            gallery.innerHTML = '<p style="text-align:center; color:#64748b; padding: 20px;">No works found.</p>';
            return;
        }

        items.forEach(item => {
            let adminControls = isAdmin ? `
                <div class="admin-controls">
                    <button class="edit-btn" onclick="editItem('${item.id}', '${encodeURIComponent(item.room || '')}', '${encodeURIComponent(item.desc || '')}')">Edit</button>
                    <button class="del-btn" onclick="deleteItem('${item.id}')">Delete</button>
                </div>
            ` : '';

            gallery.innerHTML += `
                <div class="image-card">
                    <div class="room-badge">🏠 Room: ${item.room || 'General'}</div>
                    <img src="${item.img}" alt="TV Service Image">
                    <p>${item.desc}</p>
                    <span class="date-tag">${item.date || ''}</span>
                    ${adminControls}
                </div>
            `;
        });
    }

    function filterGallery() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = allItems.filter(item => {
            const roomMatch = (item.room || "").toLowerCase().includes(query);
            const descMatch = (item.desc || "").toLowerCase().includes(query);
            return roomMatch || descMatch;
        });
        renderGallery(filtered);
    }

    function editItem(docId, currentRoom, currentDesc) {
        let decRoom = decodeURIComponent(currentRoom);
        let decDesc = decodeURIComponent(currentDesc);
        
        let newRoom = prompt("Edit Room Number:", decRoom);
        if (newRoom !== null) {
            let newDesc = prompt("Edit Description:", decDesc);
            if (newDesc !== null) {
                db.collection("tvgallery").doc(docId).update({
                    room: newRoom.trim(),
                    desc: newDesc
                }).then(() => {
                    alert("Updated successfully!");
                }).catch(error => {
                    alert("Error updating: " + error.message);
                });
            }
        }
    }

    function deleteItem(docId) {
        if (confirm("Are you sure you want to delete this image?")) {
            db.collection("tvgallery").doc(docId).delete();
        }
    }

    loadGallery();
</script>

</body>
</html>
