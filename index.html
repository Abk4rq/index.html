    <style>
        * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border-color 0.3s; }

        body.dark { 
            background: #030712;
            color: #f8fafc;
        }
        body.dark .container { background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        body.dark .search-input, body.dark input[type="text"], body.dark input[type="file"], body.dark select, body.dark textarea { background: rgba(30, 41, 59, 0.8); color: #fff; border-color: rgba(255, 255, 255, 0.12); }
        body.dark .image-card { background: rgba(30, 41, 59, 0.6); border-color: rgba(255, 255, 255, 0.08); }
        body.dark .weather-box { background: rgba(30, 41, 59, 0.8); border-color: rgba(255, 255, 255, 0.08); }
        body.dark #adminPanel { background: rgba(30, 41, 59, 0.95); border-color: rgba(56, 189, 248, 0.4); }

        body.light { 
            background: #f1f5f9;
            color: #0f172a;
        }
        body.light .container { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(0, 0, 0, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
        body.light .search-input, body.light input[type="text"], body.light input[type="file"], body.light select, body.light textarea { background: #f8fafc; color: #0f172a; border-color: rgba(0, 0, 0, 0.15); }
        body.light .image-card { background: #ffffff; border-color: rgba(0, 0, 0, 0.08); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        body.light .weather-box { background: #ffffff; border-color: rgba(0, 0, 0, 0.08); }
        body.light #adminPanel { background: #f8fafc; border-color: rgba(56, 189, 248, 0.4); }
        body.light .header-logo p, body.light .footer-text, body.light .date-tag { color: #64748b; }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; padding: 10px; direction: ltr;
            user-select: none; -webkit-user-select: none;
        }

        /* تم توسيع الموقع ليأخذ راحته بالكامل بدون مساحات سوداء جانبية مزعجة */

        .secret-admin-btn:hover { background: #38bdf8; transform: scale(1.3); }

            position: fixed; right: 15px; bottom: 20px; z-index: 999;

        .floating-call { background: rgba(14, 165, 233, 0.9); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .live-clock {

            font-size: 11px; font-weight: bold;
            background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);

        }

        /* نافذة تكبير الصورة (Lightbox) لتملأ الشاشة بالكامل وبوضوح تام للاستمارات والطلبات */
        #lightbox {

            background-color: rgba(0, 0, 0, 0.95); align-items: center; justify-content: center; padding: 10px;
        }
        #lightbox-content {
            position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        }
        #lightboxImg {
            max-width: 98vw; max-height: 98vh; width: auto; height: auto; border-radius: 8px; object-fit: contain;

            position: absolute; top: 20px; right: 25px; font-size: 45px; color: #fff; cursor: pointer; font-weight: bold; z-index: 10;

        }
        .lightbox-btn:hover { background: #38bdf8; border-color: #38bdf8; }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .lightbox-counter {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #38bdf8; font-family: monospace; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 6px 16px; border-radius: 8px;

        .date-tag { font-size: 11px; display: block; margin-bottom: 12px; font-family: 'Courier New', Courier, monospace; }
        
        .card-actions { display: flex; gap: 8px; }
        .card-actions button {

        .share-btn:hover { background: #38bdf8; color: #fff; }
        .like-btn { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

        .edit-btn { background: rgba(217, 119, 6, 0.2); color: #fbbf24; border: 1px solid rgba(217, 119, 6, 0.4); }

        .del-btn { background: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid rgba(220, 38, 38, 0.4); }
        .del-btn:hover { background: #dc2626; color: white; }

        .footer { text-align: center; margin-top: 30px; padding-top: 15px; border-top: 1px solid rgba(100, 116, 139, 0.2); grid-column: 1 / -1; }
        .footer-text { font-size: 10px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 2px; }
        .creation-date { font-size: 11px; margin-bottom: 10px; font-family: 'Courier New', Courier, monospace; }
        .dev-name {

            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1px; display: inline-block;
        }
    </style>
</head>

<script>
    let isAdmin = false;
    let allItems = [];
    let currentCategory = 'All';
    let secretClicks = 0;

    let currentLightboxImages = [];
    let currentLightboxIndex = 0;

    function secretAdminLogin() {
        secretClicks++;
        if (secretClicks >= 3) {
            secretClicks = 0;
            loginAdmin();
        }
        setTimeout(() => { secretClicks = 0; }, 1500);
    }

    function openLightbox(imagesJson, index) {
        currentLightboxImages = JSON.parse(imagesJson);
        currentLightboxIndex = index;
        updateLightboxView();
        document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }

    function updateLightboxView() {
        let imgElem = document.getElementById('lightboxImg');
        let counterElem = document.getElementById('lightboxCounter');
        let prevBtn = document.querySelector('.lightbox-prev');
        let nextBtn = document.querySelector('.lightbox-next');

        imgElem.src = currentLightboxImages[currentLightboxIndex];
        counterElem.innerText = `${currentLightboxIndex + 1}/${currentLightboxImages.length}`;

        if (currentLightboxImages.length <= 1) {
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            counterElem.style.display = 'none';
        } else {
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
            counterElem.style.display = 'block';
        }
    }

    function changeLightboxSlide(direction) {
        currentLightboxIndex += direction;
        if (currentLightboxIndex < 0) {
            currentLightboxIndex = currentLightboxImages.length - 1;
        } else if (currentLightboxIndex >= currentLightboxImages.length) {
            currentLightboxIndex = 0;
        }
        updateLightboxView();
    }

    function changeSlide(cardId, direction, totalImages) {
        let imgElem = document.getElementById(`slide-img-${cardId}`);
        let counterElem = document.getElementById(`slide-counter-${cardId}`);
        let imagesAttr = imgElem.getAttribute('data-images');
        let images = JSON.parse(imagesAttr);
        let currentIndex = parseInt(imgElem.getAttribute('data-index'));

        currentIndex += direction;
        if (currentIndex < 0) {
            currentIndex = totalImages - 1;
        } else if (currentIndex >= totalImages) {
            currentIndex = 0;
        }

        imgElem.setAttribute('data-index', currentIndex);
        imgElem.src = images[currentIndex];
        
        let clickAttr = `openLightbox('${imagesAttr.replace(/'/g, "\\'")}', ${currentIndex})`;
        imgElem.setAttribute('onclick', clickAttr);
        
        if(counterElem) {
            counterElem.innerText = `${currentIndex + 1}/${totalImages}`;
        }
    }

    async function fetchWeather() {
        try {
            let res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=30.5081&current_weather=true');
            let data = await res.json();
            let temp = data.current_weather.temperature;

    firebase.initializeApp(firebaseConfig);

    function saveData() {
        const roomInput = document.getElementById('roomInput');
        const categoryInput = document.getElementById('categoryInput');
        const statusInput = document.getElementById('statusInput');
        const fileInput = document.getElementById('imgInput');
        const descInput = document.getElementById('descInput');
        
        if (fileInput.files.length === 0) {
            alert("Please select at least one image!");
            return;
        }

        const files = fileInput.files;
        alert(`Compressing and publishing ${files.length} image(s)...`);

        let compressedImages = [];
        let processedCount = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const reader = new FileReader();

            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    const MAX_HEIGHT = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    compressedImages.push(canvas.toDataURL('image/jpeg', 0.85));
                    processedCount++;

                    if (processedCount === files.length) {
                        const date = new Date().toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                        db.collection("tvgallery").add({
                            room: roomInput.value.trim() || "General",
                            category: categoryInput.value,
                            status: statusInput.value,
                            likes: 0,
                            images: compressedImages,
                            desc: descInput.value || "",
                            date: date,
                            timestamp: Date.now()
                        })
                        .then(() => {
                            roomInput.value = '';
                            fileInput.value = '';
                            descInput.value = '';
                            alert("Published successfully!");
                        })
                        .catch(error => {
                            alert("Error: " + error.message);
                        });
                    }
                };
            };
            reader.readAsDataURL(file);
        }
    }

    function loadGallery() {
        db.collection("tvgallery").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            allItems = [];
            snapshot.forEach(doc => {
                let data = doc.data();
                if (!data.images && data.img) {
                    data.images = [data.img];
                }
                allItems.push({ id: doc.id, ...data });
            });
            document.getElementById('statsCounter').innerText = `📊 Total Works Published: ${allItems.length}`;
            filterGallery();
        });
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterGallery();
    }

    function renderGallery(items) {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        if (items.length === 0) {
            gallery.innerHTML = '<p style="text-align:center; color:#64748b; padding: 20px; grid-column: 1/-1;">No works found.</p>';
            return;
        }

        items.forEach((item, index) => {
            let isCompleted = item.status === 'Completed';
            let statusClass = isCompleted ? 'status-completed' : 'status-progress';
            let statusText = isCompleted ? '✅ Completed' : '❌ Pending';
            let currentLikes = item.likes || 0;
            let imgList = item.images || [item.img];
            let uniqueId = item.id || index;
            
            let imagesJson = JSON.stringify(imgList).replace(/"/g, '&quot;');

            let sliderHtml = '';
            if (imgList.length > 1) {
                sliderHtml = `
                    <div class="slider-container">
                        <button class="slider-btn prev-btn" onclick="changeSlide('${uniqueId}', -1, ${imgList.length})">&#10094;</button>
                        <img id="slide-img-${uniqueId}" src="${imgList[0]}" data-index="0" data-images='${JSON.stringify(imgList)}' alt="TV Service" onclick="openLightbox('${imagesJson}', 0)" title="Click to view full screen">
                        <button class="slider-btn next-btn" onclick="changeSlide('${uniqueId}', 1, ${imgList.length})">&#10095;</button>
                        <div class="slider-counter" id="slide-counter-${uniqueId}">1/${imgList.length}</div>
                    </div>
                `;
            } else {
                sliderHtml = `
                    <div class="slider-container">
                        <img id="slide-img-${uniqueId}" src="${imgList[0]}" data-index="0" data-images='${JSON.stringify(imgList)}' alt="TV Service" onclick="openLightbox('${imagesJson}', 0)" title="Click to view full screen">
                    </div>
                `;
            }

            let adminControls = isAdmin ? `
                <div class="admin-controls">
                    <button class="edit-btn" onclick="editItem('${item.id}', '${encodeURIComponent(item.room || '')}', '${encodeURIComponent(item.desc || '')}', '${item.status || 'Completed'}')">Edit</button>
                    <button class="del-btn" onclick="deleteItem('${item.id}')">Delete</button>
                </div>
            ` : '';

            gallery.innerHTML += `
                <div class="image-card">
                    <div>
                        <div class="card-header-info">
                            <div class="room-badge">🏠 Room: ${item.room || 'General'}</div>
                            <div class="status-badge ${statusClass}">${statusText}</div>
                        </div>
                        ${sliderHtml}
                        <p>${item.desc}</p>
                    </div>
                    <div>
                        <span class="date-tag">${item.date || ''}</span>
                        <div class="card-actions">
                            <button class="share-btn" onclick="shareCard('${item.room || 'General'}', '${encodeURIComponent(item.desc || '')}')">📤 Share</button>
                            <button class="like-btn" onclick="likeItem('${item.id}', ${currentLikes})">❤️ ${currentLikes}</button>
                        </div>
                        ${adminControls}
                    </div>
                </div>
            `;
        });
    }

    function likeItem(docId, currentLikes) {
        db.collection("tvgallery").doc(docId).update({
            likes: currentLikes + 1
        }).catch(error => {
            alert("Error: " + error.message);
        });
    }

    function filterGallery() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = allItems.filter(item => {
            const matchesCategory = (currentCategory === 'All' || item.category === currentCategory);
            const matchesSearch = (item.room || "").toLowerCase().includes(query) || (item.desc || "").toLowerCase().includes(query);
            return matchesCategory && matchesSearch;
        });
        renderGallery(filtered);
    }

    function shareCard(room, desc) {
        let text = `TV Service Work - Room: ${room}\nDetails: ${decodeURIComponent(desc)}`;
        if (navigator.share) {
            navigator.share({ title: 'TV Service', text: text }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            alert("Details copied to clipboard!");
        }
    }

    function editItem(docId, currentRoom, currentDesc, currentStatus) {
        let decRoom = decodeURIComponent(currentRoom);
        let decDesc = decodeURIComponent(currentDesc);
        
        let newRoom = prompt("Edit Room Number:", decRoom);
        if (newRoom !== null) {
            let newDesc = prompt("Edit Description:", decDesc);
            if (newDesc !== null) {
                let newStatus = prompt("Edit Status (Completed / Pending):", currentStatus);
                db.collection("tvgallery").doc(docId).update({
                    room: newRoom.trim(),
                    desc: newDesc,
                    status: newStatus ? newStatus.trim() : currentStatus
                }).then(() => {
                    alert("Updated successfully!");
                }).catch(error => {
                    alert("Error updating: " + error.message);
                });
            }
        }
    }

    function deleteItem(docId) {
        if (confirm("Are you sure you want to delete this image?")) {
            db.collection("tvgallery").doc(docId).delete();
        }
    }

    loadGallery();
</script>
