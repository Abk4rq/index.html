<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV SERVICE - Official Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #090d16, #111827, #090d16);
            background-attachment: fixed;
            margin: 0; 
            padding: 20px; 
            direction: rtl; 
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        }
        
        .live-clock {
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .header-logo { 
            text-align: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            padding-bottom: 20px; 
            margin-bottom: 25px; 
            cursor: pointer;
        }
        .header-logo h1 { 
            font-size: 42px; 
            font-weight: 900; 
            margin: 0; 
            background: linear-gradient(45deg, #00c6ff, #0072ff, #9b51e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            text-shadow: 0 5px 15px rgba(0, 198, 255, 0.2);
        }
        .header-logo p { 
            margin: 6px 0 0 0; 
            color: #64748b; 
            font-size: 13px; 
            font-weight: 600;
            letter-spacing: 1px;
        }

        #adminPanel { 
            display: none; 
            background: rgba(15, 23, 42, 0.7); 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 25px; 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .form-title { color: #38bdf8; font-weight: bold; margin-top: 0; margin-bottom: 15px; font-size: 16px; }
        
        input[type="file"], textarea { 
            width: 100%; padding: 12px; margin-bottom: 15px; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 12px; 
            color: #fff;
            font-family: 'Cairo', sans-serif; font-size: 14px;
            outline: none;
        }
        input[type="file"]::file-selector-button {
            background: linear-gradient(45deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
        }
        textarea { resize: vertical; height: 90px; }
        textarea::placeholder { color: #64748b; }
        
        .add-btn { 
            width: 100%; padding: 12px; 
            background: linear-gradient(45deg, #10b981, #047857); 
            color: white; border: none; border-radius: 12px; 
            font-weight: bold; font-size: 16px; cursor: pointer; 
            transition: 0.3s; 
        }
        .add-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .image-card { 
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07); 
            padding: 18px; margin-top: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        .image-card img { 
            width: 100%; max-height: 420px; object-fit: contain; 
            border-radius: 14px; display: block; margin-bottom: 15px; 
            background: rgba(0,0,0,0.4);
        }
        .image-card p { 
            font-size: 16px; color: #e2e8f0; margin: 10px 0; 
            line-height: 1.6; font-weight: 600;
            word-break: break-word;
        }
        .date-tag { 
            font-size: 12px; color: #64748b; display: block; margin-bottom: 15px; 
            direction: ltr; text-align: right;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .admin-controls { display: flex; gap: 10px; margin-top: 15px; }
        .admin-controls button { 
            flex: 1; padding: 10px; border: none; border-radius: 10px; 
            font-weight: bold; font-family: 'Cairo', sans-serif; cursor: pointer; 
            transition: 0.2s; 
        }
        .edit-btn { background-color: #d97706; color: white; }
        .del-btn { background-color: #dc2626; color: white; }

        .contact-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            margin-top: 35px;
            text-align: center;
        }
        .contact-box h3 {
            font-size: 15px;
            color: #38bdf8;
            margin: 0 0 12px 0;
        }
        .contact-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .contact-btn {
            flex: 1;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }
        .whatsapp-btn {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .whatsapp-btn:hover {
            background: #10b981;
            color: white;
        }
        .call-btn {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .call-btn:hover {
            background: #0ea5e9;
            color: white;
        }

        .footer { 
            text-align: center; margin-top: 25px; padding-top: 20px; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .footer-text { color: #64748b; font-size: 11px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .creation-date { color: #94a3b8; font-size: 12px; margin-bottom: 12px; font-family: 'Courier New', Courier, monospace; }
        
        .dev-name {
            font-size: 19px;
            font-weight: 900;
            background: linear-gradient(45deg, #f43f5e, #a855f7, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            display: inline-block;
            text-shadow: 0 2px 15px rgba(168, 85, 247, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="live-clock" id="liveClock">Loading Date & Time...</div>

    <div class="header-logo" ondblclick="loginAdmin()" title="Developer Area">
        <h1>TV SERVICE</h1>
        <p>OFFICIAL MEDIA GALLERY</p>
    </div>

    <div id="adminPanel">
        <p class="form-title">لوحة تحكم المطور ⚙️</p>
        <input type="file" id="imgInput" accept="image/*">
        <textarea id="descInput" placeholder="اكتب وصف الصورة هنا..."></textarea>
        <button class="add-btn" onclick="saveData()">نشر الصورة الآن</button>
    </div>

    <div id="gallery"></div>

    <div class="contact-box">
        <h3>للاتصال وخدمات الصيانة</h3>
        <div class="contact-buttons">
            <a href="https://wa.me/9647818025533" target="_blank" class="contact-btn whatsapp-btn">
                💬 واتساب
            </a>
            <a href="tel:+9647818025533" class="contact-btn call-btn">
                📞 اتصال هاتفي
            </a>
        </div>
    </div>

    <div class="footer">
        <div class="footer-text">Designed & Developed by</div>
        <div class="dev-name">Abdullah Ahmed TV SERVICE</div>
        <div class="creation-date" style="margin-top: 10px;">Website Created: 2026</div>
    </div>
</div>

<script>
    let isAdmin = false;

    function updateClock() {
        const now = new Date();
        const optionsDate = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' };
        const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        
        let dateStr = now.toLocaleDateString('en-US', optionsDate);
        const timeStr = now.toLocaleTimeString('en-US', optionsTime);
        
        document.getElementById('liveClock').innerText = `${dateStr} | ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loginAdmin() {
        if (!isAdmin) {
            let password = prompt("أدخل كلمة المرور الخاصة بالمطور:");
            if (password && password.trim() === "1234") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                renderGallery();
                alert("أهلاً بك يا عبد الله، تم تفعيل صلاحيات التعديل والحذف.");
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }
    }

    // ضغط الصورة تلقائياً لتستوعب عدد هائل من الصور بدون امتلاء الذاكرة
    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                const MAX_WIDTH = 800;
                const MAX_HEIGHT = 800;
                
                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                }
                
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                callback(compressedDataUrl);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function saveData() {
        const fileInput = document.getElementById('imgInput');
        const descInput = document.getElementById('descInput');
        
        if (!fileInput.files[0]) {
            alert("يرجى اختيار صورة أولاً!");
            return;
        }

        compressImage(fileInput.files[0], function(compressedData) {
            const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            const date = new Date().toLocaleDateString('en-US', options);

            const newItem = {
                id: Date.now(),
                img: compressedData,
                desc: descInput.value || "",
                date: date
            };

            let data = JSON.parse(localStorage.getItem('tvServiceGalleryV4') || '[]');
            data.unshift(newItem); 
            localStorage.setItem('tvServiceGalleryV4', JSON.stringify(data));

            fileInput.value = '';
            descInput.value = '';

            renderGallery();
            alert("تم نشر الصورة بنجاح!");
        });
    }

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        
        let data = JSON.parse(localStorage.getItem('tvServiceGalleryV4') || '[]');

        if (data.length === 0) {
            gallery.innerHTML = '<p style="text-align:center; color:#64748b; padding: 30px; font-size:14px;">No images uploaded yet.</p>';
            return;
        }

        data.forEach(item => {
            let adminButtons = '';
            if (isAdmin) {
                adminButtons = `
                    <div class="admin-controls">
                        <button class="edit-btn" onclick="editItem(${item.id})">تعديل الوصف</button>
                        <button class="del-btn" onclick="deleteItem(${item.id})">حذف الصورة</button>
                    </div>
                `;
            }

            gallery.innerHTML += `
                <div class="image-card" id="card-${item.id}">
                    <img src="${item.img}" alt="Gallery Image">
                    <p id="desc-${item.id}">${item.desc}</p>
                    <span class="date-tag">${item.date}</span>
                    ${adminButtons}
                </div>
            `;
        });
    }

    function deleteItem(id) {
        if (confirm("هل أنت متأكد من حذف هذه الصورة نهائياً؟")) {
            let data = JSON.parse(localStorage.getItem('tvServiceGalleryV4') || '[]');
            data = data.filter(item => item.id !== id);
            localStorage.setItem('tvServiceGalleryV4', JSON.stringify(data));
            renderGallery();
        }
    }

    function editItem(id) {
        let data = JSON.parse(localStorage.getItem('tvServiceGalleryV4') || '[]');
        const currentItem = data.find(i => i.id === id);
        
        if (currentItem) {
            const newDesc = prompt("أدخل الوصف الجديد:", currentItem.desc);
            if (newDesc !== null) {
                currentItem.desc = newDesc;
                localStorage.setItem('tvServiceGalleryV4', JSON.stringify(data));
                renderGallery();
            }
        }
    }

    renderGallery();
</script>

</body>
</html>
